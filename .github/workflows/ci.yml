name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: Fehler als Annotation melden
        if: failure()
        shell: bash
        run: |
          grep -E "error:|What went wrong|Could not|FAILED|Exception" -A4 build.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
      - uses: actions/upload-artifact@v4
        with:
          name: npcbridge-plugin
          path: plugin/build/libs/*.jar
